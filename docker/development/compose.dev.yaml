services:
  # -------------------------------------------------------
  # 1) Supabase Database Service
  # -------------------------------------------------------
  supabase_db:
    image: supabase/postgres:15.6.1.138
    container_name: bn_supabase_db_dev
    ports:
      - "5432:5432"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: supabase_auth_admin
      POSTGRES_PASSWORD: secretdevpassword
    restart: unless-stopped

  # -------------------------------------------------------
  # 2) Supabase Auth Service (GoTrue API)
  # -------------------------------------------------------
  supabase_auth:
    image: supabase/gotrue:v2.152.0
    container_name: bn_supabase_auth_dev
    ports:
      - "9999:9999"
    depends_on:
      - supabase_db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:secretdevpassword@supabase_db:5432/postgres?sslmode=disable
      GOTRUE_JWT_SECRET: super-secret-jwt-key-for-development-32-chars
      GOTRUE_JWT_EXP: 3600
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SITE_URL: http://localhost:3000
    restart: unless-stopped

  # -------------------------------------------------------
  # 3) Supabase Storage Service (BARU ✨)
  # -------------------------------------------------------
  supabase_storage:
    image: supabase/storage-api:v1.11.1
    container_name: bn_supabase_storage_dev
    ports:
      - "5000:5000" # API Storage lokal berjalan di port 5000
    depends_on:
      - supabase_db
    volumes:
      - supabase_storage_files:/var/lib/storage # Tempat menyimpan file fisik lokal
    environment:
      PORT: 5000
      ANON_KEY: super-secret-jwt-key-for-development-32-chars
      SERVICE_KEY: super-secret-jwt-key-for-development-32-chars
      JWT_SECRET: super-secret-jwt-key-for-development-32-chars
      
      # Database untuk simpan metadata object/bucket
      DATABASE_URL: postgres://supabase_auth_admin:secretdevpassword@supabase_db:5432/postgres?sslmode=disable
      
      # Menentukan driver penyimpanan (kita pakai lokal/file system laptop)
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      
      # Menonaktifkan enkripsi SSL internal untuk mempermudah dev lokal
      PGRST_JWT_SECRET: super-secret-jwt-key-for-development-32-chars
    restart: unless-stopped

  # -------------------------------------------------------
  # LAYANAN NEXT.JS (website, spmb, admin tetap sama seperti sebelumnya)
  # -------------------------------------------------------
  website:
    image: node:22-alpine
    container_name: bn_app_website_dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - ../.env
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/apps/website/.next
    command: sh -c "corepack enable && pnpm --filter website dev"
    depends_on:
      - supabase_auth
      - supabase_storage

  spmb:
    image: node:22-alpine
    container_name: bn_app_spmb_dev
    working_dir: /app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
    env_file:
      - ../.env
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/apps/spmb/.next
    command: sh -c "corepack enable && pnpm --filter spmb dev"
    depends_on:
      - supabase_auth
      - supabase_storage

  admin:
    image: node:22-alpine
    container_name: bn_app_admin_dev
    working_dir: /app
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
    env_file:
      - ../.env
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/apps/admin/.next
    command: sh -c "corepack enable && pnpm --filter admin dev"
    depends_on:
      - supabase_auth
      - supabase_storage

volumes:
  supabase_db_data:
  supabase_storage_files: # Volume fisik baru untuk berkas ungguhan